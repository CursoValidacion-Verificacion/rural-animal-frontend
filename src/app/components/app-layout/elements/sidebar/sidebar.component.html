<div class="logo-wrapper">
  <div
    id="rural"
    style="color: #77c040; font-size: 28px; font-weight: 400; height: 22px"
  >
    <p>Rural <span style="color: #333">Animal</span></p>
  </div>

  <div class="back-btn" (click)="layoutService.toggleSidebar()">
    <i class="fa-solid fa-arrow-left"></i>
  </div>

  <div class="toggle-sidebar" (click)="layoutService.toggleSidebar()"></div>
</div>

<div class="logo-icon-wrapper">
  <a href="javascript:void(0)">
    <img
      class="img-fluid"
      src="../../../../../assets/icons/logo@2x.png"
      width="35"
      alt=""
    />
  </a>
</div>

<nav class="sidebar-main" style="height: 690px">
  <div
    id="left-arrow"
    class="left-arrow"
    [ngClass]="{ 'd-none': !showLeftArrow }"
  >
    <!-- <app-feather-icon icon="arrow-left"></app-feather-icon> -->
  </div>

  <div id="sidebar-menu" style="margin-left: 0px">
    <ul class="sidebar-links custom-scrollbar">
      <div class="simplebar-wrapper">
        <div class="simplebar-mask">
          <div class="simplebar-offset">
            <div class="simplebar-content-wrapper">
              <div class="simplebar-content">
                <li class="back-btn">
                  <a href="javascript:void(0)">
                    <img
                      class="img-fluid"
                      src="../../../../../assets/img/login/login-bg.jpg"
                      alt="Logo"
                    />
                  </a>
                  <div
                    class="mobile-back text-end"
                    (click)="layoutService.toggleSidebar()"
                  >
                    <span>Atrás</span>
                    <i class="fa fa-angle-right ps-2" aria-hidden="true"></i>
                  </div>
                </li>

                <li class="sidebar-main-title">
                  <div></div>
                </li>

                <!-- Loop through routes -->
                <ng-container *ngFor="let route of permittedRoutes">
                  <li class="sidebar-list">
                    <a
                      routerLink="{{ route.path }}"
                      routerLinkActive="active"
                      class="sidebar-link sidebar-title"
                    >
                      <!-- Display icon if present -->
                      <i
                        *ngIf="route.data?.['icon']"
                        class="fa {{ route.data?.['icon'] }}"
                        style="margin-right: 10px"
                      ></i>
                      <span>{{ route.data?.['name'] }}</span>
                    </a>
                  </li>
                </ng-container>
              </div>
            </div>
          </div>
        </div>
      </div>
    </ul>
  </div>

  <div
    class="right-arrow"
    id="right-arrow"
    [ngClass]="{ 'd-none': !showRigthArrow }"
  >
    <!-- <app-feather-icon icon="arrow-right"></app-feather-icon> -->
  </div>
</nav>
