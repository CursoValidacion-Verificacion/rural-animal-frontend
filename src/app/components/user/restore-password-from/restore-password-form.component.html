<form [formGroup]="userForm" class="row" (ngSubmit)="callSave()">
  <div
    id="rural"
    style="color: #77c040; font-size: 28px; font-weight: 400; height: 22px"
  >
    <p>Rural <span style="color: #333">Animal</span></p>
  </div>
  <div>
    <h2 class="mt-5 mb-3">Restablecer contraseña</h2>
  </div>

  <!-- Antigua contraseña -->
  <div class="mb-2 position-relative">
    <label class="mb-1" for="oldPassword">Antigua contraseña*</label>
    <input
      id="oldPassword"
      formControlName="oldPassword"
      [type]="oldPasswordVisible ? 'text' : 'password'"
      class="form-control"
    />
    <i
      class="fa fa-eye position-absolute"
      [ngClass]="{
        'fa-eye-slash': oldPasswordVisible,
        'fa-eye': !oldPasswordVisible
      }"
      style="cursor: pointer; top: 35px; right: 10px"
      (click)="toggleOldPasswordVisibility()"
    ></i>
    <div
      *ngIf="
        userForm.controls['oldPassword'].invalid &&
        (userForm.controls['oldPassword'].dirty ||
          userForm.controls['oldPassword'].touched)
      "
    >
      <p class="text-danger my-1">Este campo es obligatorio</p>
    </div>
  </div>

  <!-- Contraseña -->
  <div class="mb-2 position-relative">
    <label class="mb-1" for="password">Contraseña*</label>
    <input
      id="password"
      formControlName="password"
      [type]="passwordVisible ? 'text' : 'password'"
      class="form-control"
    />
    <i
      class="fa fa-eye position-absolute"
      [ngClass]="{
        'fa-eye-slash': passwordVisible,
        'fa-eye': !passwordVisible
      }"
      style="cursor: pointer; top: 35px; right: 10px"
      (click)="togglePasswordVisibility()"
    ></i>
    <div
      *ngIf="
        userForm.controls['password'].invalid &&
        (userForm.controls['password'].dirty ||
          userForm.controls['password'].touched)
      "
    >
      <p class="text-danger my-1">Este campo es obligatorio</p>
    </div>
  </div>

  <!-- Confirmar contraseña -->
  <div class="mb-2 position-relative">
    <label class="mb-1" for="confirmPassword">Confirmar contraseña*</label>
    <input
      id="confirmPassword"
      formControlName="confirmPassword"
      [type]="confirmPasswordVisible ? 'text' : 'password'"
      class="form-control"
    />
    <i
      class="fa fa-eye position-absolute"
      [ngClass]="{
        'fa-eye-slash': confirmPasswordVisible,
        'fa-eye': !confirmPasswordVisible
      }"
      style="cursor: pointer; top: 35px; right: 10px"
      (click)="toggleConfirmPasswordVisibility()"
    ></i>
    <div
      *ngIf="
        userForm.controls['confirmPassword'].invalid &&
        (userForm.controls['confirmPassword'].dirty ||
          userForm.controls['confirmPassword'].touched)
      "
    >
      <p class="text-danger my-1">Este campo es obligatorio</p>
    </div>
    <div
      *ngIf="
        userForm.controls['confirmPassword'].value !==
        userForm.controls['password'].value
      "
    >
      <p class="text-danger my-1">Las contraseñas no coinciden</p>
    </div>
  </div>

  <!-- Botón de registro -->
  <div class="d-flex justify-content-end">
    <button class="registrar" type="submit">
      Registrar
    </button>
    <button (click)="onCancel()" class="btn btn-secondary ms-2" type="button">
      Cancelar
    </button>
  </div>
</form>
