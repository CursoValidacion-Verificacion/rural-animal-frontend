<form [formGroup]="addressForm" class="address-form">
  <div class="form-group">
    <label for="province">Provincia</label>
    <select
      id="province"
      formControlName="provinceId"
      class="form-control"
      (change)="onProvinceSelect($event)"
    >
      <option value="" disabled selected>Seleccione una provincia</option>
      @for (province of provinces; track province.id) {
      <option [value]="province.id">{{ province.name }}</option>
      }
    </select>
    <div *ngIf="addressForm.get('provinceId')?.invalid && addressForm.get('provinceId')?.touched" class="error-message">
      Este campo no puede estar vacío.
    </div>
  </div>

  <div class="form-group">
    <label for="canton">Cantón</label>
    <select
      id="canton"
      formControlName="cantonId"
      class="form-control"
      (change)="onCantonSelect($event)"
      [disabled]="!addressForm.get('provinceId')?.value"
    >
      <option value="" disabled selected>Seleccione un cantón</option>
      @for (canton of cantons; track canton.id) {
      <option [value]="canton.id">{{ canton.name }}</option>
      }
    </select>
    <div *ngIf="addressForm.get('cantonId')?.invalid && addressForm.get('cantonId')?.touched" class="error-message">
      Este campo no puede estar vacío.
    </div>
  </div>

  <div class="form-group">
    <label for="district">Distrito</label>
    <select
      id="district"
      formControlName="districtId"
      class="form-control"
      (change)="onDistrictSelect($event)"
      [disabled]="!addressForm.get('cantonId')?.value"
    >
      <option value="" disabled selected>Seleccione un distrito</option>
      @for (district of districts; track district.id) {
      <option [value]="district.id">{{ district.name }}</option>
      }
    </select>
    <div *ngIf="addressForm.get('districtId')?.invalid && addressForm.get('districtId')?.touched" class="error-message">
      Este campo no puede estar vacío.
    </div>
  </div>

  <div class="form-group">
    <label for="otherDetails">Otras señas</label>
    <input
      id="otherDetails"
      formControlName="otherDetails"
      type="text"
      class="form-control"
    />
    @if (showError('otherDetails')) {
    <div class="error-message">Este campo no puede estar vacío.</div>
    }
  </div>

  <!-- Campos ocultos para los nombres -->
  <input type="hidden" formControlName="province" />
  <input type="hidden" formControlName="canton" />
  <input type="hidden" formControlName="district" />
</form>
