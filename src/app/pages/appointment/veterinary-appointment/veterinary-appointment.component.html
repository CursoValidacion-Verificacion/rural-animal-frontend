@defer {
    <div class="row p-4">
        <div class="col-12">
            @if (this.authService.hasAnyRole([IRoleType.admin, IRoleType.superAdmin])) {
                <app-full-calendar [appointments]="appointments()"></app-full-calendar>
            } @else {
                <ul class="nav nav-tabs mb-3" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button
                                class="nav-link active"
                                id="appointments-tab"
                                data-bs-toggle="tab"
                                data-bs-target="#appointments"
                                type="button"
                                role="tab"
                                aria-controls="appointments"
                                aria-selected="true">
                            Mis Citas
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button
                                class="nav-link"
                                id="calendar-tab"
                                data-bs-toggle="tab"
                                data-bs-target="#calendar"
                                type="button"
                                role="tab"
                                aria-controls="calendar"
                                aria-selected="false">
                            Agendar Cita
                        </button>
                    </li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="appointments" role="tabpanel"
                         aria-labelledby="appointments-tab">

                        <app-veterinary-appointment-list
                                [title]="'Citas veterinarias'"
                                [appointments]='this.veterinaryAppointmentService.appointments$()'>
                        </app-veterinary-appointment-list>
                    </div>
                    <div class="tab-pane fade" id="calendar" role="tabpanel" aria-labelledby="calendar-tab">
                        <app-appointment-form>
                        </app-appointment-form>
                    </div>
                </div>
            }
        </div>
    </div>
} @loading (minimum 1.5s) {
    <app-loader></app-loader>
}
