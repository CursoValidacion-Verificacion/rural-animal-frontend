<div class="role-selector-container">
  <div class="role-selector-card">
    <h2>Selecciona tu rol</h2>
    <p>¿Cómo te gustaría usar nuestra plataforma?</p>
    <div class="role-buttons">
      <button (click)="selectRole('BUYER')">
        <h3>Comprador</h3>
        <p>Quiero comprar animales</p>
      </button>
      <button (click)="selectRole('SELLER')">
        <h3>Vendedor</h3>
        <p>Quiero vender mis animales</p>
      </button>
    </div>
  </div>
</div>
