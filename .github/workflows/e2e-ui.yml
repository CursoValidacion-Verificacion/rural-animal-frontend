name: E2E UI Automation

on:
  push:
    branches: [ "main", "develop", "pipeline-test" ]
  pull_request:
    branches: [ "main", "develop", "pipeline-test" ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: 12345
          MARIADB_DATABASE: proyecto3_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -p12345"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mariadb://localhost:3306/proyecto3_test
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 12345
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_PROFILES_ACTIVE: test
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4200
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Install frontend/root dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build backend
        run: mvn -B clean package -DskipTests

      - name: Start backend
        run: |
          nohup java -jar target/*.jar > backend.log 2>&1 &
        shell: bash

      - name: Wait for backend
        run: npx wait-on http://127.0.0.1:8080

      - name: Start frontend Angular
        run: |
          nohup npm run start -- --host 0.0.0.0 --port 4200 > frontend.log 2>&1 &
        shell: bash

      - name: Wait for frontend
        run: npx wait-on http://127.0.0.1:4200

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: |
            backend.log
            frontend.log