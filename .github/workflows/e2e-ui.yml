name: E2E UI Staging

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "e2e-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:4200
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Configure staging backend for E2E
        env:
          API_URL: ${{ secrets.RAILWAY_STAGING_API_URL }}
          WS_URL: ${{ secrets.RAILWAY_STAGING_WS_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Missing required secret: RAILWAY_STAGING_API_URL"
            exit 1
          fi

          if [ -z "$WS_URL" ]; then
            WS_URL="${API_URL/https:\/\//wss://}"
            WS_URL="${WS_URL/http:\/\//ws://}"
          fi

          cat > src/assets/runtime-env.js <<EOF
          window.__RURAL_ANIMAL_API_URL__ = "$API_URL";
          window.__RURAL_ANIMAL_WS_URL__ = "$WS_URL";
          EOF

      - name: Run Playwright tests against staging backend
        env:
          API_URL: ${{ secrets.RAILWAY_STAGING_API_URL }}
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/reports/html
            test-results
          retention-days: 14

      - name: Prepare Playwright report for GitHub Pages
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p e2e/reports/html
          if [ ! -f e2e/reports/html/index.html ]; then
            cat > e2e/reports/html/index.html <<'EOF'
            <!doctype html>
            <html lang="en">
              <head>
                <meta charset="utf-8" />
                <title>Playwright Report</title>
              </head>
              <body>
                <h1>No Playwright HTML report was generated.</h1>
                <p>The test run may have failed before report generation.</p>
                <p>Check the GitHub Actions logs and artifacts for details.</p>
              </body>
            </html>
            EOF
          fi

      - name: Upload report artifact for GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: e2e/reports/html

  deploy-e2e-report:
    if: always() && github.event_name != 'pull_request'
    needs: e2e-tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Playwright report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
